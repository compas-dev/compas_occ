name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.release.outputs.is-release }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: compas-dev/compas-actions/release-check@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate

  package:
    needs: detect
    if: needs.detect.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: compas-dev/compas-actions/prepare-release@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
        with:
          python-version: "3.12"
          import-modules: compas_occ
          distribution-artifact-name: python-package-distributions

  publish:
    needs: [detect, package]
    if: needs.detect.outputs.is-release == 'true'
    environment: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist

  github-release:
    needs: [detect, package, publish]
    if: needs.detect.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: compas-dev/compas-actions/github-release@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
        with:
          github-token: ${{ github.token }}
          tag-name: ${{ needs.detect.outputs.tag }}
          target: ${{ github.sha }}
          release-name-prefix: COMPAS OCC
          distribution-artifact-name: python-package-distributions

  docs:
    needs: [detect, publish]
    if: needs.detect.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: compas-dev/compas-actions/setup-python@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
        with:
          python-version: "3.12"
          management-tool: conda
          conda-environment: occ-docs
          environment-file: environment.yml
      - name: Synchronize locked documentation dependencies
        shell: bash -el {0}
        run: VIRTUAL_ENV="$CONDA_PREFIX" uv sync --active --inexact --frozen --extra docs
      - name: Build documentation strictly
        shell: bash -el {0}
        run: VIRTUAL_ENV="$CONDA_PREFIX" uv run --active --no-sync mkdocs build --strict
      - uses: compas-dev/compas-actions/docs@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
        with:
          setup-project: "false"
          prepared-conda-environment: occ-docs
          dependency-groups: ""
          extras: docs
          config-file: mkdocs.yml
          strict: "true"
          deploy: "true"
          github-token: ${{ github.token }}
          alias: latest
          version: ${{ needs.detect.outputs.version }}

