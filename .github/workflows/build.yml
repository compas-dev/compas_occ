name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, c3-upgrade]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'docs-only') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
    steps:
      - uses: compas-dev/compas-actions/ci@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
        with:
          python-version: ${{ matrix.python }}
          management-tool: conda
          conda-environment: occ-ci
          environment-file: environment.yml
          invoke-tasks: ""
      - name: Synchronize locked Python dependencies
        shell: bash -el {0}
        run: VIRTUAL_ENV="$CONDA_PREFIX" uv sync --active --inexact --frozen --extra dev
      - name: Verify PythonOCC
        shell: bash -el {0}
        run: VIRTUAL_ENV="$CONDA_PREFIX" uv run --active --no-sync python -c "from OCC.Core.BRep import BRep_Tool"
      - name: Test
        shell: bash -el {0}
        run: VIRTUAL_ENV="$CONDA_PREFIX" uv run --active --no-sync invoke test
      - name: Verify typed wheel and installed consumer
        if: runner.os == 'Linux'
        shell: bash -el {0}
        run: |
          mkdir -p "$RUNNER_TEMP/compas-occ-source"
          mkdir -p "$RUNNER_TEMP/compas-occ-dist"
          mkdir -p "$RUNNER_TEMP/compas-core-source"
          mkdir -p "$RUNNER_TEMP/compas-core-dist"
          git archive --format=tar HEAD | tar -xf - -C "$RUNNER_TEMP/compas-occ-source"
          git clone --filter=blob:none --no-checkout https://github.com/compas-dev/compas.git "$RUNNER_TEMP/compas-core-source"
          git -C "$RUNNER_TEMP/compas-core-source" fetch --depth 1 origin 3c1a2e8e0e5c4c14292ecf4bb38c82e5b977273e
          git -C "$RUNNER_TEMP/compas-core-source" checkout --detach 3c1a2e8e0e5c4c14292ecf4bb38c82e5b977273e
          cd "$RUNNER_TEMP/compas-core-source"
          VIRTUAL_ENV="$CONDA_PREFIX" uv run --active --no-sync python -m build --wheel --outdir "$RUNNER_TEMP/compas-core-dist"
          cd "$RUNNER_TEMP/compas-occ-source"
          VIRTUAL_ENV="$CONDA_PREFIX" uv run --active --no-sync python -m build --wheel --outdir "$RUNNER_TEMP/compas-occ-dist"
          VIRTUAL_ENV="$CONDA_PREFIX" uv run --active --no-sync python .github/scripts/verify_typed_wheel.py --check-consumer --core-wheel "$RUNNER_TEMP"/compas-core-dist/*.whl "$RUNNER_TEMP"/compas-occ-dist/*.whl

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: compas-dev/compas-actions/ci@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
        with:
          python-version: "3.12"
          management-tool: conda
          conda-environment: occ-quality
          environment-file: environment.yml
          invoke-tasks: ""
      - name: Synchronize locked quality dependencies
        shell: bash -el {0}
        run: VIRTUAL_ENV="$CONDA_PREFIX" uv sync --active --inexact --frozen --extra dev
      - name: Verify PythonOCC
        shell: bash -el {0}
        run: VIRTUAL_ENV="$CONDA_PREFIX" uv run --active --no-sync python -c "from OCC.Core.BRep import BRep_Tool"
      - name: Lint and format
        shell: bash -el {0}
        run: |
          VIRTUAL_ENV="$CONDA_PREFIX" uv run --active --no-sync ruff check .
          VIRTUAL_ENV="$CONDA_PREFIX" uv run --active --no-sync ruff format --check .
      - name: Type check source
        shell: bash -el {0}
        run: VIRTUAL_ENV="$CONDA_PREFIX" uv run --active --no-sync pyright src/compas_occ
