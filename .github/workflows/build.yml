name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'docs-only') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
    steps:
      - uses: compas-dev/compas-actions/ci@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
        with:
          python-version: ${{ matrix.python }}
          management-tool: conda
          conda-environment: occ-ci
          environment-file: environment.yml
          invoke-tasks: ""
      - name: Synchronize locked Python dependencies
        shell: bash -el {0}
        run: VIRTUAL_ENV="$CONDA_PREFIX" uv sync --active --inexact --frozen --extra dev --extra docs
      - name: Verify PythonOCC
        shell: bash -el {0}
        run: VIRTUAL_ENV="$CONDA_PREFIX" uv run --active --no-sync python -c "from OCC.Core.BRep import BRep_Tool"
      - name: Test
        shell: bash -el {0}
        run: VIRTUAL_ENV="$CONDA_PREFIX" uv run --active --no-sync invoke test
      - name: Lint and format
        shell: bash -el {0}
        run: |
          VIRTUAL_ENV="$CONDA_PREFIX" uv run --active --no-sync ruff check .
          VIRTUAL_ENV="$CONDA_PREFIX" uv run --active --no-sync ruff format --check .
      - name: Type check
        shell: bash -el {0}
        run: VIRTUAL_ENV="$CONDA_PREFIX" uv run --active --no-sync pyright

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: compas-dev/compas-actions/ci@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
        with:
          python-version: "3.12"
          management-tool: conda
          conda-environment: occ-docs
          environment-file: environment.yml
          invoke-tasks: ""
      - name: Synchronize locked documentation dependencies
        shell: bash -el {0}
        run: VIRTUAL_ENV="$CONDA_PREFIX" uv sync --active --inexact --frozen --extra docs
      - name: Strict documentation
        shell: bash -el {0}
        run: VIRTUAL_ENV="$CONDA_PREFIX" uv run --active --no-sync mkdocs build --strict
