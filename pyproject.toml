[build-system]
requires = ["setuptools>=66.0"]
build-backend = "setuptools.build_meta"

# ============================================================================
# project info
# ============================================================================

[project]
name = "compas_occ"
description = "COMPAS wrapper for the Python bindings of OCC."
keywords = ["compas", "nurbs", "brep", "occ"]
authors = [
    { name = "tom van mele", email = "tom.v.mele@gmail.com" },
    { name = "Lotte Aldinger", email = "aldinger@arch.ethz.ch" },
    { name = "Chen Kasirer", email = "kasirer@arch.ethz.ch" },
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12,<3.13"
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["compas>=3.0.0,<4"]

[project.optional-dependencies]
dev = [
    "build",
    "bump-my-version",
    "compas_invocations2",
    "invoke >=0.14",
    "pyright==1.1.414",
    "pytest",
    "ruff",
    "twine",
    "wheel",
]
docs = [
    "markdown-callouts >=0.4",
    "markdown-exec >=1.8",
    "mike",
    "mkdocs >=1.6",
    "mkdocs-autorefs >=1.4",
    "mkdocs-coverage >=1.0",
    "mkdocs-git-revision-date-localized-plugin >=1.2",
    "mkdocs-llmstxt >=0.2",
    "mkdocs-material >=9.5",
    "mkdocs-minify-plugin >=0.8",
    "mkdocs-redirects >=1.2",
    "mkdocs-section-index >=0.3",
    "mkdocstrings[python]",
    "pydantic >=2.10",
    "tomli >=2.0; python_version < '3.11'",
]
viz = ["compas_viewer"]

[project.urls]
Homepage = "https://compas-dev.github.io/compas_occ"
Repository = "https://github.com/compas-dev/compas_occ"

[project.entry-points."compas.plugins"]
compas_occ_brep = "compas_occ.plugins.brep"
compas_occ_curves = "compas_occ.plugins.curves"
compas_occ_intersections = "compas_occ.plugins.intersections"
compas_occ_surfaces = "compas_occ.plugins.surfaces"

# ============================================================================
# setuptools config
# ============================================================================

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true
zip-safe = false

[tool.setuptools.dynamic]
version = { attr = "compas_occ.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
compas_occ = ["py.typed"]

# ============================================================================
# replace pytest.ini
# ============================================================================

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests", "src/compas_occ"]
python_files = ["test_*.py", "*_test.py", "test.py"]
addopts = ["-ra", "--strict-markers", "--tb=short"]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "IGNORE_EXCEPTION_DETAIL",
    "ALLOW_UNICODE",
    "ALLOW_BYTES",
    "NUMBER",
]

# ============================================================================
# replace bumpversion.cfg
# ============================================================================

[tool.bumpversion]
current_version = "1.5.0"
message = "Bump version to {new_version}"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "src/compas_occ/__init__.py"
search = "{current_version}"
replace = "{new_version}"

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "Unreleased"
replace = "[{new_version}] {now:%Y-%m-%d}"

# ============================================================================
# replace setup.cfg
# ============================================================================

[tool.ruff]
line-length = 179
indent-width = 4
target-version = "py312"
extend-include = ["docs/examples/**/*.py"]
# Ruff rewrites MkDocs `---8<---` snippet directives as Python operators.
extend-exclude = ["docs/examples/**/*.md", "docs/tutorial.md"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["I001"]
"tests/*" = ["I001"]
"tasks.py" = ["I001"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["compas", "compas_occ"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 179

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pyright]
include = ["src/compas_occ", "docs/examples"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.uv.sources]
compas = { git = "https://github.com/compas-dev/compas.git", rev = "f626151278b6fbea6c3dd271dcb096923c6073c3" }
